name: build-and-push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - ".gitea/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    # 빌드가 실행되는 컨테이너를, harbor.k8s.donga.ac.kr에 있는 이미지로 특정
    container:
      image: harbor.k8s.donga.ac.kr/library/runner-image:ubuntu-latest
      credentials:
        username: playce-admin
        password: Hj24I9n93ubYdNoicTwpf19DmBhTT1Zr
    steps:
      - name: Checkout
        # Dau.DX.Api repo에 checkout
        run: |
          git config --global http.sslVerify false
          git clone https://giteav2.donga.ac.kr/cramis/Dau.DX.Api.git .
          git checkout ${{ github.sha }}

      - name: Docker login (Harbor)
        shell: bash
        run: |
          echo "Hj24I9n93ubYdNoicTwpf19DmBhTT1Zr" | docker login harbor.k8s.donga.ac.kr -u "playce-admin" --password-stdin

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="harbor.k8s.donga.ac.kr/dau-dx-api/dau-dx-api"
          SHA="${{ gitea.sha }}"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Build and push frontend image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="harbor.k8s.donga.ac.kr/dau-dx-api/dau-dx-api-frontend"
          SHA="${{ gitea.sha }}"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" ./frontend
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Build and push MCP image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="harbor.k8s.donga.ac.kr/dau-dx-api/dau-dx-api-mcp"
          SHA="${{ gitea.sha }}"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" ./mcp
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
