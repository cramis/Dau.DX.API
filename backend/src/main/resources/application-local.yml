# 로컬 MetaDB(dev Oracle 26ai Free, Tailscale — 구 사내 DEVORA19 는 2026-06-07 폐기) 연결.
# Oracle 미기동 상태에서도 앱이 부팅되도록 Hikari initialization-fail-timeout=-1 (M1 스모크).
# DB 연결 검증은 /actuator/health 의 db 지표로 확인.
spring:
  datasource:
    url: ${DXAPI_DB_URL:jdbc:oracle:thin:@//cramis-macbookpro.tail181647.ts.net:1521/freepdb1}
    username: ${DXAPI_DB_USER:dxapi}
    password: ${DXAPI_DB_PASSWORD:dxapi6805}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: meta-pool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1 FROM DUAL
