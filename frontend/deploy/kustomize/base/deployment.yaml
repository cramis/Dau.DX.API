apiVersion: apps/v1
kind: Deployment
metadata:
  name: dau-dx-api-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dau-dx-api-frontend
  template:
    metadata:
      labels:
        app: dau-dx-api-frontend
    spec:
      imagePullSecrets:
        - name: harbor-dau-dx-api-pull
      containers:
        - name: frontend
          image: harbor.k8s.donga.ac.kr/dau-dx-api/dau-dx-api-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL
              value: http://dau-dx-api.dev.svc.cluster.local
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
