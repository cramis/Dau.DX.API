apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dau-dx-api-mcp-redirect
spec:
  parentRefs:
    - name: shared-gw
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - dau-dx-api-mcp.192.168.50.163.nip.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dau-dx-api-mcp
spec:
  parentRefs:
    - name: shared-gw
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - dau-dx-api-mcp.192.168.50.163.nip.io
  rules:
    - backendRefs:
        - name: dau-dx-api-mcp
          port: 80
