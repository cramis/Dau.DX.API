# MCP 서버를 공개 호스트 dxapi.donga.ac.kr 의 /mcp 경로에 노출 — 백엔드 전달 시 /mcp prefix 제거.
# 호스트 http→https 리다이렉트는 frontend HTTPRoute(redirect)가 처리하므로 여기선 https 라우트만 정의.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dau-dx-api-mcp
spec:
  parentRefs:
    - name: shared-gw
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - dxapi.donga.ac.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: dau-dx-api-mcp
          port: 80
